version: "3.8"

services:
  todo-api:
    build:
      context: ./todo
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8008:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - todo-api
    restart: unless-stopped
