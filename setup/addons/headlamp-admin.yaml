# ─────────────────────────────────────────────────────────────
# Headlamp Admin — ServiceAccount + ClusterRoleBinding
# ─────────────────────────────────────────────────────────────
# Creates an admin user for Headlamp.
# Use:  kubectl -n kube-system create token headlamp-admin
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: kube-system
