# ─────────────────────────────────────────────────────────────
# Kind Cluster Configuration — VVCE Lab
# ─────────────────────────────────────────────────────────────
# 1 control-plane  +  2 worker nodes
# Extra port mappings expose ingress-nginx on localhost:80/443
# ─────────────────────────────────────────────────────────────
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vvce-lab-cluster

nodes:
  # ── Control Plane ──────────────────────────────────────────
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP  → ingress-nginx
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS → ingress-nginx
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  # ── Worker 1 ───────────────────────────────────────────────
  - role: worker

  # ── Worker 2 ───────────────────────────────────────────────
  - role: worker

# ── Registry Support ─────────────────────────────────────────
containerdConfigPatches:
- |-
  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
    endpoint = ["http://kind-registry:5000"]
